name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          KS_PATH: ${{ github.workspace }}/signing/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk ExpenseManagement.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ExpenseManagement.apk \
            --title "Expense Management 1.0.${{ github.run_number }}" \
            --notes "Open this page on your Android phone, tap ExpenseManagement.apk to download, then open the file to install." \
            --latest

      - name: Report build error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -n -A30 "What went wrong" build.log | head -80 || true; echo '---'; tail -n 60 build.log || true; echo '```'; } > err.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file err.md
