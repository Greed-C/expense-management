name: Publish web app (iPhone / browser)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          git log -1 --format=%ct > app/src/main/assets/webver.txt
          mkdir _site
          cp app/src/main/assets/* _site/
          python3 - <<'PY'
          import hashlib, json, os
          d = 'app/src/main/assets'
          files = {f: hashlib.sha256(open(os.path.join(d, f), 'rb').read()).hexdigest() for f in sorted(os.listdir(d)) if f != 'webver.txt'}
          out = {'web': int(open(os.path.join(d, 'webver.txt')).read().strip()), 'native': int(open('native-version.txt').read().strip()),
                 'apkUrl': 'https://github.com/Greed-C/expense-management/releases/latest', 'files': files}
          json.dump(out, open('_site/update.json', 'w'), indent=1)
          PY
          cp web/* _site/
          sed -i "s/__BUILD__/${{ github.run_number }}/" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
