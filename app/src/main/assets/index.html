<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7a57">
<title>Expense Management</title>
<style>
/* Ledger-green on paper: one calm accent, semantic colors only for over-budget states. Layout: summary first, then charts, then the list. */
:root{
  --bg:#eef2ee; --card:#ffffff; --ink:#13241c; --ink2:#4e5f57; --muted:#86958d; --line:#dde5df;
  --accent:#0d7a57; --accent-soft:#d8efe5; --needs:#2a78d6; --wants:#eb6834; --save:#1baf7a;
  --bad:#c23b3b; --bad-soft:#fbe6e4; --warn:#b77900; --inc:#0d7a57; --exp:#eb6834; --inv:#6250d6;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --card:#17221d; --ink:#e9f1ec; --ink2:#b4c3bb; --muted:#7f8f87; --line:#26342d;
  --accent:#3fbf8f; --accent-soft:#183a2d; --needs:#3987e5; --wants:#d95926; --save:#199e70; --bad:#e66767; --bad-soft:#3a1f1f; --warn:#e0a52b; --inc:#3fbf8f; --exp:#d95926; --inv:#9085e9; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714; --card:#17221d; --ink:#e9f1ec; --ink2:#b4c3bb; --muted:#7f8f87; --line:#26342d;
  --accent:#3fbf8f; --accent-soft:#183a2d; --needs:#3987e5; --wants:#d95926; --save:#199e70; --bad:#e66767; --bad-soft:#3a1f1f; --warn:#e0a52b; --inc:#3fbf8f; --exp:#d95926; --inv:#9085e9; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px}
.spacer{flex:1}
.pillbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.pillbtn:focus-visible,.chip:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.monthnav button:hover{background:var(--bg)}
.monthnav .lbl{min-width:118px;text-align:center;font-weight:600;font-size:14px}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink2)}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
@media (max-width:640px){nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;border-radius:16px 16px 0 0;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.25fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 2px;font-family:var(--display);font-size:16px;font-weight:600;text-wrap:balance}
.card .hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.sub{color:var(--ink2);font-size:13.5px;margin-top:6px}
.delta{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.delta.up{background:var(--bad-soft);color:var(--bad)} .delta.down{background:var(--accent-soft);color:var(--accent)}
.meter{height:12px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:10px}
.meter > i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.meter.over > i{background:var(--bad)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.catrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.ico{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:16px}
.catrow .nm{font-size:14px;font-weight:500}
.bar{height:7px;border-radius:999px;background:var(--bg);margin-top:5px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over > i{background:var(--bad)}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body)}
.split{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.split{grid-template-columns:1fr}}
.splitrow{margin:8px 0}
.splitrow .top{display:flex;justify-content:space-between;font-size:13.5px}
.target{position:relative;height:8px;border-radius:999px;background:var(--bg);margin-top:5px}
.target > i{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:999px}
.target > b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.list .day{font-size:12.5px;color:var(--muted);margin:14px 2px 4px;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:start}
.item:hover{border-color:var(--accent)}
.item .ico{width:36px;height:36px}
.item .t{font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.toolbar input,.toolbar select{flex:1;min-width:140px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fab{position:fixed;inset-inline-end:22px;bottom:26px;width:62px;height:62px;border-radius:20px;border:0;background:var(--accent);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 10px 24px rgba(13,122,87,.35);z-index:25}
@media (max-width:640px){.fab{bottom:86px}}
.sheetbg{position:fixed;inset:0;background:rgba(10,20,15,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
@media (min-width:641px){.sheetbg{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 12px;font-family:var(--display);font-size:19px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12.5px;color:var(--ink2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amountin{font-family:var(--display);font-size:28px;font-weight:700;text-align:center}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.chip .e{font-size:20px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:#fff;flex:1}
.btn.ghost{background:var(--bg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:8px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;display:none}
.banner.show{display:block}
.tip{position:fixed;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;display:none;z-index:60;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;display:none}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.setgrid label{display:grid;grid-template-columns:28px 1fr 96px;gap:8px;align-items:center;font-size:13.5px}
.setgrid input{padding:7px 9px}
.hidden{display:none!important}
.suggs{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.sugg{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.sugg:hover{border-color:var(--accent)}
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;cursor:pointer;text-align:start}
.datebtn:focus-visible,.monthnav .lbl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.monthnav .lbl{border:0;background:transparent;cursor:pointer;border-radius:999px;padding:6px 4px;font:inherit;font-weight:600;font-size:14px;color:var(--ink)}
.monthnav .lbl:hover{background:var(--bg)}
.pkbg{position:fixed;inset:0;background:rgba(10,20,15,.45);display:none;z-index:80;align-items:center;justify-content:center;padding:16px}
.pkbg.open{display:flex}
.pk{background:var(--card);border-radius:20px;width:100%;max-width:340px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pkhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pktitle{flex:1;border:0;background:var(--bg);border-radius:10px;padding:9px 12px;text-align:start;font-weight:700;cursor:pointer;font-size:15px}
.pktitle.static{cursor:default}
.pkarrow{border:0;background:transparent;width:36px;height:36px;border-radius:10px;cursor:pointer;color:var(--ink2);font-size:13px}
.pkarrow:hover,.pktitle:not(.static):hover{background:var(--accent-soft)}
.pkgrid{display:grid;gap:4px}
.pkgrid.days{grid-template-columns:repeat(7,1fr)}
.pkgrid.mons{grid-template-columns:repeat(4,1fr);gap:8px}
.pkwd{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);padding:6px 0}
.pkc{border:0;background:transparent;aspect-ratio:1;border-radius:50%;cursor:pointer;font-size:14px;color:var(--ink);display:grid;place-items:center}
.pkgrid.mons .pkc{aspect-ratio:auto;height:58px;border-radius:999px;font-size:14.5px}
.pkc:hover{background:var(--accent-soft)}
.pkc.dim{color:var(--muted);opacity:.6}
.pkc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.pkc.sel{background:var(--accent);color:#fff;font-weight:700}
.pkc:focus-visible,.pkarrow:focus-visible,.pktitle:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pkfoot{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.pkfoot button{border:0;background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.flowk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:820px){.flowk{grid-template-columns:repeat(2,1fr)}}
.kt{font-size:12.5px;color:var(--ink2)}
.kn{font-family:var(--display);font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.pos{color:var(--accent)} .neg{color:var(--bad)}
.rec{display:grid;gap:10px}
.recrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.recrow:last-child{border-bottom:0}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status.ok{background:var(--accent-soft);color:var(--accent)} .status.bad{background:var(--bad-soft);color:var(--bad)}
.tipline{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55}
.incform{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:820px){.incform{grid-template-columns:1fr 1fr}}
.incform label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2)}

@media (prefers-reduced-motion:no-preference){.meter>i,.bar>i{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot">₪</span><span id="t_brand">Expense Management</span></div>
    <div class="spacer"></div>
    <div class="monthnav"><button id="prev" aria-label="previous">‹</button><button class="lbl" id="mlabel" type="button"></button><button id="next" aria-label="next">›</button></div>
    <button class="pillbtn" id="langBtn">English</button>
  </header>
  <div class="banner" id="banner"></div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="home" id="t_home">ראשי</button>
    <button class="tab" data-v="list" id="t_list">הוצאות</button>
    <button class="tab" data-v="flow" id="t_flow">הכנסות / הוצאות</button>
    <button class="tab" data-v="year" id="t_year">שנה</button>
    <button class="tab" data-v="settings" id="t_settings">הגדרות</button>
  </nav>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Add expense">+</button>

<div class="sheetbg" id="sheetbg">
  <form class="sheet" id="sheet" autocomplete="off">
    <h2 id="sheetTitle"></h2>
    <label class="field"><span id="l_amount"></span><input id="f_amount" class="amountin money" type="text" inputmode="decimal" autocomplete="off" placeholder="₪ 0" required></label>
    <label class="field"><span id="l_name"></span><input id="f_name" autocomplete="off" maxlength="80"></label><div class="suggs" id="nameSugg"></div>
    <div class="field"><span id="l_cat"></span><div class="chips" id="f_cats"></div></div>
    <div class="row2">
      <div class="field"><span id="l_date"></span><button type="button" class="datebtn" id="f_date" data-value=""><span id="f_date_txt"></span><span aria-hidden="true">📅</span></button></div>
      <label class="field"><span id="l_method"></span><select id="f_method"></select></label>
    </div>
    <label class="field"><span id="l_note"></span><input id="f_note"></label>
    <div class="actions"><button type="submit" class="btn primary" id="saveBtn"></button><button type="button" class="btn danger hidden" id="delBtn"></button><button type="button" class="btn ghost" id="cancelBtn"></button></div>
  </form>
</div>
<div class="pkbg" id="pkbg"><div class="pk" role="dialog" aria-modal="true"><div class="pkhead"><button class="pktitle" id="pktitle" type="button"></button><button class="pkarrow" id="pkup" type="button" aria-label="previous">▲</button><button class="pkarrow" id="pkdown" type="button" aria-label="next">▼</button></div><div id="pkbody"></div><div class="pkfoot"><button type="button" id="pktoday"></button><button type="button" id="pkcancel"></button></div></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- categories ----------
const BASE_CATS=[
 {id:'housing',e:'🏠',he:'דיור ושכירות',en:'Housing & rent',type:'needs'},
 {id:'bills',e:'💡',he:'חשבונות',en:'Bills',type:'needs'},
 {id:'arnona',e:'🏛️',he:'ארנונה',en:'Arnona',type:'needs'},
 {id:'groceries',e:'🛒',he:'סופר ומזון',en:'Groceries',type:'needs'},
 {id:'car',e:'🚗',he:'רכב',en:'Car',type:'needs'},
 {id:'fuel',e:'⛽',he:'דלק',en:'Fuel',type:'needs'},
 {id:'transport',e:'🚌',he:'תחבורה',en:'Transport',type:'needs'},
 {id:'health',e:'💊',he:'בריאות',en:'Health',type:'needs'},
 {id:'education',e:'🎓',he:'לימודים',en:'Education',type:'needs'},
 {id:'phone',e:'📱',he:'טלפון ואינטרנט',en:'Phone & internet',type:'needs'},
 {id:'pets',e:'🐾',he:'חיות מחמד',en:'Pets',type:'needs'},
 {id:'family',e:'👪',he:'משפחה',en:'Family',type:'needs'},
 {id:'eatingout',e:'🍔',he:'אוכל בחוץ',en:'Eating out',type:'wants'},
 {id:'shopping',e:'🛍️',he:'קניות',en:'Shopping',type:'wants'},
 {id:'fun',e:'🎮',he:'בילוי ופנאי',en:'Fun & gaming',type:'wants'},
 {id:'subs',e:'🔁',he:'מנויים',en:'Subscriptions',type:'wants'},
 {id:'gifts',e:'🎁',he:'מתנות',en:'Gifts',type:'wants'},
 {id:'travel',e:'✈️',he:'חופשות',en:'Travel',type:'wants'},
 {id:'savings',e:'🐷',he:'חיסכון והשקעות',en:'Savings & investing',type:'save'},
 {id:'other',e:'📦',he:'אחר',en:'Other',type:'wants'}];

function yearFlowChart(y){
  const inV=[],exV=[],ivV=[];for(let i=1;i<=12;i++){const L=EXP.filter(e=>inMonth(e,y,i));inV.push(sum(incOf(y,i)));exV.push(spendOf(L));ivV.push(savedOf(L))}
  const W=700,H=250,pl=48,pr=10,pt=14,pb=28; const max=Math.max(1,...inV,...exV,...ivV);
  const raw=max/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(k=>k*pw).find(k=>k>=raw),top=step*4;
  const cw=(W-pl-pr)/12,bw=Math.min(13,cw*.26),gap=2; const Y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="direction:ltr">`;
  for(let i=0;i<=4;i++){const yy=Y(step*i);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" font-size="11" text-anchor="end">${(step*i/1000).toLocaleString('en-US',{maximumFractionDigits:1})}k</text>`}
  const bar=(x,v,col)=>{const h=(H-pt-pb)*v/top;if(h<=0)return '';const yy=H-pb-h,r=Math.min(3,h);return `<path d="M${x},${H-pb}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${H-pb}Z" fill="${col}"/>`};
  for(let i=0;i<12;i++){const cx=pl+cw*i+cw/2,x0=cx-(3*bw+2*gap)/2;
    s+=bar(x0,inV[i],'var(--inc)')+bar(x0+bw+gap,exV[i],'var(--exp)')+bar(x0+2*(bw+gap),ivV[i],'var(--inv)');
    s+=`<text x="${cx}" y="${H-9}" font-size="11" text-anchor="middle">${monthName(y,i+1,true)}</text>`;
    s+=`<rect x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent" data-month="${i+1}" style="cursor:pointer" data-tip="<b>${monthName(y,i+1)}</b><br>${t('incAmt')}: ${ils(inV[i])}<br>${t('spentL')}: ${ils(exV[i])}<br>${t('investedL')}: ${ils(ivV[i])}"/>`}
  return s+'</svg>';
}

function isoToday(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso+'T12:00');return d.toLocaleDateString(LANG==='he'?'he-IL':'en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}
function setDateBtn(id,iso){const b=document.getElementById(id);b.dataset.value=iso;const tx=b.querySelector('span');(tx||b).textContent=fmtDate(iso)}
const PK={mode:'day',base:'day',y:0,m:1,sel:null,cb:null};
const pkbg=document.getElementById('pkbg');
function openPicker(opts){ // {value:'YYYY-MM-DD' or 'YYYY-MM', mode:'day'|'month'|'year', onPick}
  const v=opts.value||isoToday(); PK.y=+v.slice(0,4); PK.m=+v.slice(5,7)||1; PK.sel=v; PK.base=opts.mode||'day'; PK.mode=PK.base; PK.cb=opts.onPick;
  document.getElementById('pktoday').textContent=t('today'); document.getElementById('pkcancel').textContent=t('cancel');
  drawPicker(); pkbg.classList.add('open'); setTimeout(()=>{const f=pkbg.querySelector('.pkc.sel')||pkbg.querySelector('.pkc');f&&f.focus()},30);
}
function closePicker(){pkbg.classList.remove('open')}
function drawPicker(){
  const title=document.getElementById('pktitle'), body=document.getElementById('pkbody'); const loc=LANG==='he'?'he-IL':'en-US';
  const td=isoToday();
  if(PK.mode==='day'){
    title.textContent=new Date(PK.y,PK.m-1,1).toLocaleString(loc,{month:'long',year:'numeric'}); title.classList.remove('static');
    const wd=LANG==='he'?['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳']:['Su','Mo','Tu','We','Th','Fr','Sa'];
    const first=new Date(PK.y,PK.m-1,1).getDay(); const start=new Date(PK.y,PK.m-1,1-first);
    let h=wd.map(w=>`<div class="pkwd">${w}</div>`).join('');
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      h+=`<button type="button" class="pkc ${d.getMonth()+1!==PK.m?'dim':''} ${iso===td?'today':''} ${iso===PK.sel?'sel':''}" data-d="${iso}">${d.getDate()}</button>`}
    body.innerHTML=`<div class="pkgrid days">${h}</div>`;
  } else if(PK.mode==='month'){
    title.textContent=String(PK.y); title.classList.remove('static');
    let h='';for(let m=1;m<=12;m++){const sel=PK.sel&&PK.sel.slice(0,7)===ym(PK.y,m);const cur=td.slice(0,7)===ym(PK.y,m);
      h+=`<button type="button" class="pkc ${sel?'sel':''} ${cur?'today':''}" data-m="${m}">${new Date(PK.y,m-1,1).toLocaleString(loc,{month:'short'})}</button>`}
    body.innerHTML=`<div class="pkgrid mons">${h}</div>`;
  } else {
    const d0=Math.floor(PK.y/10)*10; title.textContent=d0+' – '+(d0+9); title.classList.add('static');
    let h='';for(let y=d0-2;y<d0+14;y++){const sel=PK.sel&&+PK.sel.slice(0,4)===y;
      h+=`<button type="button" class="pkc ${y<d0||y>d0+9?'dim':''} ${sel?'sel':''} ${y===now.getFullYear()?'today':''}" data-y="${y}">${y}</button>`}
    body.innerHTML=`<div class="pkgrid mons">${h}</div>`;
  }
}
document.getElementById('pktitle').onclick=()=>{if(PK.mode==='day')PK.mode='month';else if(PK.mode==='month')PK.mode='year';drawPicker()};
function pkStep(dir){if(PK.mode==='day'){PK.m+=dir;if(PK.m<1){PK.m=12;PK.y--}if(PK.m>12){PK.m=1;PK.y++}}else if(PK.mode==='month')PK.y+=dir;else PK.y+=10*dir;drawPicker()}

document.getElementById('pktoday').onclick=()=>{const td=isoToday();if(PK.base==='day'){PK.cb&&PK.cb(td)}else if(PK.base==='month'){PK.cb&&PK.cb(td.slice(0,7))}else{PK.cb&&PK.cb(td.slice(0,4))}closePicker()};

  if(b.dataset.d){PK.cb&&PK.cb(b.dataset.d);closePicker()}
  else if(b.dataset.m){PK.m=+b.dataset.m;if(PK.base==='month'){PK.cb&&PK.cb(ym(PK.y,PK.m));closePicker()}else{PK.mode='day';drawPicker()}}
  else if(b.dataset.y){PK.y=+b.dataset.y;if(PK.base==='year'){PK.cb&&PK.cb(String(PK.y));closePicker()}else{PK.mode='month';drawPicker()}}});
pkbg.addEventListener('wheel',e=>{if(pkbg.classList.contains('open')){e.preventDefault();pkStep(e.deltaY>0?1:-1)}},{passive:false});
document.getElementById('f_date').onclick=()=>openPicker({value:document.getElementById('f_date').dataset.value,mode:'day',onPick:v=>setDateBtn('f_date',v)});
document.getElementById('mlabel').onclick=()=>{
  if(VIEW==='year') openPicker({value:CUR.y+'-01',mode:'year',onPick:v=>{CUR.y=+v;render()}});
  else openPicker({value:ym(CUR.y,CUR.m),mode:'month',onPick:v=>{CUR={y:+v.slice(0,4),m:+v.slice(5,7)};render()}});
};
// ---------- money in / out ----------
const INC_TYPES=['salary','bonus','reserve','other'];
const incOf=(y,m)=>INC.filter(x=>x.date&&x.date.startsWith(ym(y,m)));
function salaryBase(y,m){ // this month's income, else average of last 3 months that have income
  const cur=sum(incOf(y,m)); if(cur) return {v:cur,avg:false};
  let p={y,m},vals=[];for(let i=0;i<12&&vals.length<3;i++){p=prevYM(p.y,p.m);const v=sum(incOf(p.y,p.m));if(v)vals.push(v)}
  return vals.length?{v:vals.reduce((a,b)=>a+b,0)/vals.length,avg:true}:{v:0,avg:false};
}
function carryStart(){ if(SET.carryFrom) return SET.carryFrom;
  const own=[...EXP,...INC].filter(x=>x.source&&x.source!=='imported').map(x=>x.date.slice(0,7)).sort();
  if(own.length) return own[0];
  const anyImported=[...EXP,...INC].some(x=>x.source==='imported');
  if(anyImported) return ym(now.getFullYear(),now.getMonth()+1);
  const all=[...EXP,...INC].map(x=>x.date.slice(0,7)).sort(); return all[0]||ym(now.getFullYear(),now.getMonth()+1);}
function monthNet(y,m){const L=EXP.filter(e=>inMonth(e,y,m));return sum(incOf(y,m))-spendOf(L)-savedOf(L)}
function carryInto(y,m){const st=carryStart();const target=ym(y,m);if(target<=st)return 0;let [cy,cm]=st.split('-').map(Number);let c=0;
  while(ym(cy,cm)<target){c+=monthNet(cy,cm);cm++;if(cm>12){cm=1;cy++}} return Math.round(c*100)/100}
function flowChart(y){
  const inV=[...Array(12)].map((_,i)=>sum(incOf(y,i+1))), outV=[...Array(12)].map((_,i)=>spendOf(EXP.filter(e=>inMonth(e,y,i+1))));
  const W=640,H=240,pl=48,pr=10,pt=14,pb=28; const max=Math.max(1,...inV,...outV);
  const raw=max/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(k=>k*pw).find(k=>k>=raw),top=step*4;
  const cw=(W-pl-pr)/12,bw=Math.min(16,cw*.3); const Y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="direction:ltr">`;
  for(let i=0;i<=4;i++){const yy=Y(step*i);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" font-size="11" text-anchor="end">${(step*i/1000).toLocaleString('en-US',{maximumFractionDigits:1})}k</text>`}
  const bar=(x,v,col)=>{const h=(H-pt-pb)*v/top;if(h<=0)return '';const yy=H-pb-h,r=Math.min(4,h);return `<path d="M${x},${H-pb}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${H-pb}Z" fill="${col}"/>`};
  for(let i=0;i<12;i++){const cx=pl+cw*i+cw/2; s+=bar(cx-bw-1,inV[i],'var(--save)')+bar(cx+1,outV[i],'var(--wants)');
    const net=inV[i]-outV[i]; if(inV[i]||outV[i]){s+=`<circle cx="${cx}" cy="${Y(Math.max(0,net))}" r="4" fill="${net>=0?'var(--ink)':'var(--bad)'}" stroke="var(--card)" stroke-width="2"/>`}
    s+=`<text x="${cx}" y="${H-9}" font-size="11" text-anchor="middle" ${i+1===CUR.m?'font-weight="700" style="fill:var(--ink)"':''}>${monthName(y,i+1,true)}</text>`;
    s+=`<rect x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent" data-month="${i+1}" style="cursor:pointer" data-tip="<b>${monthName(y,i+1)}</b><br>${t('incAmt')}: ${ils(inV[i])}<br>${t('spentAmt')}: ${ils(outV[i])}<br>${t('saveAmt')}: ${ils(net)}"/>`}
  return s+'</svg>';
}
function waterfall(rows){ // [{label,v,kind:'in'|'out'|'total',color}]
  const W=640,rowH=44,pl=150,pr=90,pt=6,H=pt+rows.length*rowH+6; let run=0,mx=0;
  const segs=rows.map(r=>{let a,b;if(r.kind==='in'){a=run;b=run+r.v;run=b}else if(r.kind==='out'){a=run-r.v;b=run;run=a}else{a=Math.min(0,r.v);b=Math.max(0,r.v)}mx=Math.max(mx,a,b);return {...r,a,b}});
  const mn=Math.min(0,...segs.map(x=>x.a)); const X=v=>pl+(W-pl-pr)*((v-mn)/((mx-mn)||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="direction:ltr">`;
  if(mn<0)s+=`<line x1="${X(0)}" x2="${X(0)}" y1="0" y2="${H}" stroke="var(--ink2)" stroke-dasharray="3 3"/>`;
  segs.forEach((r,i)=>{const y=pt+i*rowH+8,h=rowH-16,x1=X(r.a),x2=X(r.b),w=Math.max(2,x2-x1);
    s+=`<text x="${pl-10}" y="${y+h/2+4}" text-anchor="end" font-size="13" style="fill:var(--ink)">${esc(r.label)}</text>`;
    s+=`<rect x="${x1}" y="${y}" width="${w}" height="${h}" rx="5" fill="${r.color}" data-tip="${esc(r.label)}: ${r.kind==='out'?'−':''}${ils(r.v)}"/>`;
    s+=`<text x="${x2+8}" y="${y+h/2+4}" font-size="13" font-weight="700" style="fill:var(--ink)">${r.kind==='out'?'−':r.kind==='in'?'+':''}${ils(Math.abs(r.v))}</text>`;
    if(i<segs.length-1&&r.kind!=='total'){const nx=r.kind==='in'?x2:x1;s+=`<line x1="${nx}" x2="${nx}" y1="${y+h}" y2="${y+rowH}" stroke="var(--muted)" stroke-dasharray="2 2"/>`}});
  return s+'</svg>';
}
function cumChart(y){
  const vals=[];let c=0;const lastM=(y===now.getFullYear())?now.getMonth()+1:12;
  for(let i=1;i<=lastM;i++){c+=sum(incOf(y,i))-spendOf(EXP.filter(e=>inMonth(e,y,i)));vals.push(c)}
  const W=1000,H=210,pl=52,pr=28,pt=12,pb=26; const mn=Math.min(0,...vals),mx=Math.max(1,...vals);
  const X=i=>pl+(W-pl-pr)*(i/11), Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="direction:ltr">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(v)+4}" font-size="11" text-anchor="end">${(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})}k</text>`});
  if(mn<0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink2)"/>`;
  for(let i=0;i<12;i++)s+=`<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle">${monthName(y,i+1,true)}</text>`;
  if(vals.length){const d=vals.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join('');s+=`<path d="${d}L${X(vals.length-1)},${Y(Math.max(0,mn))}L${X(0)},${Y(Math.max(0,mn))}Z" fill="var(--accent)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    vals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===vals.length-1?4.5:3}" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5" data-tip="${monthName(y,i+1)}: ${ils(v)}"/>`})}
  return s+'</svg>';
}
function incItem(x){return `<button class="item" data-inc="${esc(x.id)}"><div class="ico">💼</div><div><div class="t">${esc(x.name)}</div><div class="small">${t(x.type==='other'?'otherInc':x.type)} · ${fmtDate(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="amt pos">+${ils2(x.amount)}</div></button>`}
function vFlow(){
  const {y,m}=CUR; const IN=sum(incOf(y,m)); const L=EXP.filter(e=>inMonth(e,y,m)); const OUT=spendOf(L); const INV=savedOf(L); const CARRY=carryInto(y,m); const left=IN-OUT; const inAcc=CARRY+IN-OUT-INV; const rate=IN?Math.round(left/IN*100):null;
  const base=salaryBase(y,m); const split={needs:0,wants:0,save:0};L.forEach(e=>{split[cat(e.cat).type]+= +e.amount||0});
  let rec;
  if(!base.v) rec=`<p class="small">${t('noBase')}</p>`;
  else{const B=base.v;const savedActual=Math.max(0,B-OUT);
    const rows=[['recNeeds',B*.5,split.needs,'max'],['recWants',B*.3,split.wants,'max'],['recSave',B*.2,savedActual,'min']];
    const okAll=rows.every(r=>r[3]==='max'?r[2]<=r[1]:r[2]>=r[1]);
    rec=`<p class="small" style="margin:0 0 6px">${t('recBase')} ${ils(B)} ${base.avg?t('avg3'):''}</p><div class="rec">${rows.map(([k,target,act,kind])=>{const ok=kind==='max'?act<=target:act>=target;return `<div class="recrow"><span>${t(k)}<div class="small">${t('actual')}: ${ils(act)}</div></span><span class="amt">${ils(target)}</span><span class="status ${ok?'ok':'bad'}">${ok?t('okS'):(kind==='max'?t('overS')+' '+ils(act-target):t('underS')+' '+ils(target-act))}</span></div>`}).join('')}</div>
    <div class="tipline" style="margin-top:10px">${okAll?t('keep')+'<br>':''}${left>0?`${t('year12')} <b>${ils(left*12)}</b>.`:''}</div>`}
  const list=incOf(y,m).sort((a,b)=>b.date.localeCompare(a.date));
  const e=incEdit?INC.find(x=>x.id===incEdit):null;
  const wf=[{label:t('carryIn'),v:CARRY,kind:'in',color:'var(--muted)'},{label:t('incAmt'),v:IN,kind:'in',color:'var(--inc)'},{label:t('spentL'),v:OUT,kind:'out',color:'var(--exp)'},{label:t('investedL'),v:INV,kind:'out',color:'var(--inv)'},{label:t('carryOut'),v:inAcc,kind:'total',color:inAcc<0?'var(--bad)':'var(--accent)'}];
  return `<div class="flowk">
    <section class="card"><div class="kt">${t('carryIn')}</div><div class="kn ${CARRY<0?'neg':''}">${ils(CARRY)}</div></section>
    <section class="card"><div class="kt">${t('inMonth')}</div><div class="kn" style="color:var(--inc)">${ils(IN)}</div></section>
    <section class="card"><div class="kt">${t('outMonth')}</div><div class="kn" style="color:var(--exp)">${ils(OUT)}</div></section>
    <section class="card"><div class="kt">${t('investedL')}</div><div class="kn" style="color:var(--inv)">${ils(INV)}</div></section>
    <section class="card"><div class="kt">${t('carryOut')}</div><div class="kn ${inAcc<0?'neg':'pos'}">${ils(inAcc)}</div></section>
    <section class="card"><div class="kt">${t('rate')}</div><div class="kn ${rate!==null&&rate<0?'neg':''}">${rate===null?'–':rate+'%'}</div><div class="meter ${rate!==null&&rate<0?'over':''}"><i style="width:${rate===null?0:Math.max(0,Math.min(100,rate))}%"></i></div></section>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <section class="card"><h3>${t('monthFlow')} · ${monthName(y,m)}</h3><p class="hint">${t('monthFlowHint')}</p>${waterfall(wf)}</section>
    <section class="card"><h3>${t('recTitle')}</h3><p class="hint">${t('recHint')}</p>${rec}</section>
  </div>
  <section class="card" style="margin-top:14px"><h3>${e?t('edited'):t('addInc')}</h3>
    <form class="incform" id="incForm" autocomplete="off" style="margin-top:10px">
      <label>${t('amount')}<input id="i_amount" class="money" type="text" inputmode="decimal" autocomplete="off" required value="${e?fmtNum(e.amount):''}"></label>
      <label>${t('incName')}<input id="i_name" required value="${esc(e?e.name:t('salary'))}"></label>
      <label>${t('incType')}<select id="i_type">${INC_TYPES.map(k=>`<option value="${k}" ${(e?e.type:'salary')===k?'selected':''}>${t(k==='other'?'otherInc':k)}</option>`).join('')}</select></label>
      <label>${t('date')}<button type="button" class="datebtn" id="i_date" data-value="${e?e.date:(y===now.getFullYear()&&m===now.getMonth()+1?isoToday():ym(y,m)+'-10')}"><span>${fmtDate(e?e.date:(y===now.getFullYear()&&m===now.getMonth()+1?isoToday():ym(y,m)+'-10'))}</span><span aria-hidden="true">📅</span></button></label>
      <div style="display:flex;gap:6px"><button class="btn primary" type="submit">${e?t('update'):t('saveB')}</button>${e?`<button class="btn danger" type="button" id="incDel">${t('del')}</button><button class="btn ghost" type="button" id="incCancel">${t('cancel')}</button>`:''}</div>
    </form></section>
  <section class="card" style="margin-top:14px"><h3>${t('incList')}</h3><div class="list" style="margin-top:8px">${list.length?list.map(incItem).join(''):`<div class="empty">${t('noInc')}</div>`}</div></section>`;
}
document.getElementById('view').addEventListener('click',e=>{
  if(e.target.closest('#s_carry')){openPicker({value:carryStart(),mode:'month',onPick:async v=>{SET.carryFrom=v;try{await db.doc('settings/main').set({income:SET.income||0,budgets:SET.budgets||{},carryFrom:v});toast(t('saved'))}catch(err){toast(t('saveErr'))}render()}});return}
  if(e.target.closest('#i_date')){openPicker({value:document.getElementById('i_date').dataset.value,mode:'day',onPick:v=>setDateBtn('i_date',v)});return}
  const ii=e.target.closest('[data-inc]'); if(ii){incEdit=ii.dataset.inc;render();document.getElementById('incForm').scrollIntoView({behavior:'smooth',block:'center'});return}
  if(e.target.id==='incCancel'){incEdit=null;render();return}
  if(e.target.id==='incDel'){const b=e.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent=t('confirmDel');return}
    db.collection('income').doc(incEdit).delete().then(()=>{incEdit=null;toast(t('deleted'))}).catch(()=>toast(t('saveErr')))}
});
document.getElementById('view').addEventListener('submit',async e=>{
  if(e.target.id!=='incForm')return; e.preventDefault(); if(!db){banner(t('noDb'));return}
  const amount=Math.round(parseAmt(document.getElementById('i_amount').value)*100)/100, name=document.getElementById('i_name').value.trim(), date=document.getElementById('i_date').dataset.value, type=document.getElementById('i_type').value;
  if(!(amount>0)||!name||!date)return;
  const prev=incEdit?INC.find(x=>x.id===incEdit):null;
  try{const ref=incEdit?db.collection('income').doc(incEdit):db.collection('income').doc();await ref.set({name,amount,date,type,note:prev?(prev.note||''):'',source:prev?(prev.source||'app'):'app',created:prev?(prev.created||Date.now()):Date.now()});
    incEdit=null; if(!date.startsWith(ym(CUR.y,CUR.m)))CUR={y:+date.slice(0,4),m:+date.slice(5,7)}; toast(t('saved')); render();}catch(err){toast(t('saveErr'))}
});

async function copyText(s){try{await navigator.clipboard.writeText(s)}catch(err){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}toast(t('copied'))}
// ---------- local on-device store (same API shape the app uses) ----------
const LS_KEY='expense_mgmt_v1';
function makeLocalDb(){
  let S; try{S=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){S={}}
  S.expenses=S.expenses||{}; S.income=S.income||{}; S.settings=S.settings||{};
  const subs={expenses:[],income:[],settings:[]};
  const persist=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){throw {code:'quota_exceeded',message:e.message}}};
  const snapOf=c=>({docs:Object.entries(S[c]).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false}});
  const fire=c=>{subs[c].forEach(f=>{try{f()}catch(e){}})};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const docRef=(c,id)=>({id,set:async d=>{S[c][id]=JSON.parse(JSON.stringify(d));persist();fire(c)},delete:async()=>{delete S[c][id];persist();fire(c)},
    onSnapshot:(n)=>{const f=()=>n({exists:!!S[c][id],data:()=>S[c][id]});subs[c].push(f);setTimeout(f,0);return()=>{subs[c]=subs[c].filter(x=>x!==f)}}});
  return {collection:c=>({doc:id=>docRef(c,id||uid()),onSnapshot:(n)=>{const f=()=>n(snapOf(c));subs[c].push(f);setTimeout(f,0);return()=>{subs[c]=subs[c].filter(x=>x!==f)}}}),
    doc:p=>{const [c,id]=p.split('/');return docRef(c,id)}};
}

// ---------- data ----------
let LOADED=false;
window.__back=function(){if(pkbg.classList.contains('open')){closePicker();return true}if(sheetbg.classList.contains('open')){closeSheet();return true}if(VIEW!=='home'){VIEW='home';render();return true}return false};
render();
(async()=>{
  const timer=setTimeout(()=>{if(!LOADED){banner(t('offline'))}},10000);
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); db=makeLocalDb(); }catch(e){ db=null }
  if(!db){clearTimeout(timer);LOADED=true;banner(t('noDb'));render();return}
  db.collection('expenses').onSnapshot(snap=>{
    EXP=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.date&&+x.amount>0);
    if(!snap.metadata.fromCache){clearTimeout(timer);banner('')}
    LOADED=true; const ae=document.activeElement; if(!(ae&&document.getElementById('view').contains(ae)&&ae.tagName==='INPUT')) render();
  },err=>{clearTimeout(timer);LOADED=true;banner(t('offline'));render()});
  db.collection('income').onSnapshot(snap=>{INC=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.date&&+x.amount>0);if(LOADED){const ae=document.activeElement;if(!(ae&&document.getElementById('view').contains(ae)&&ae.tagName==='INPUT'))render()}},()=>{});
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){const d=s.data();SET={income:d.income||0,budgets:d.budgets||{},carryFrom:d.carryFrom||null}};if(LOADED&&VIEW!=='settings')render()},()=>{});
})();
